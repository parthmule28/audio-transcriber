name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example, 0.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      # No secrets or OpenRouter API key are used, and no step uploads .wav/.m4a media files.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            gnupg
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm

      - name: Install dependencies
        run: pip install -e ".[dev,packaging]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build pinned LGPL FFmpeg from source
        shell: msys2 {0}
        run: bash packaging/build_ffmpeg.sh

      - name: Smoke test local FFmpeg features
        run: >-
          python packaging/smoke_test_ffmpeg.py
          --ffmpeg packaging/bin/ffmpeg.exe
          --ffprobe packaging/bin/ffprobe.exe

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$RELEASE_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          python packaging/build_release.py --version "$version"

      - name: Self-test packaged application
        run: |
          & dist/AudioTranscriber/AudioTranscriber.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw dist/AudioTranscriber/self-test.log
          $requiredChecks = @(
            "python-version: PASS",
            "qt-initialised: PASS",
            "ffmpeg: PASS",
            "ffprobe: PASS"
          )
          foreach ($check in $requiredChecks) {
            if (-not $log.Contains($check)) {
              throw "Self-test log is missing required check: $check"
            }
          }

      - name: Upload Windows test archive artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AudioTranscriber-windows-test
          path: dist/AudioTranscriber-v*-win-x64.zip
          if-no-files-found: error

      - name: Upload release archive artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: AudioTranscriber-release
          path: dist/AudioTranscriber-v*-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudioTranscriber-v*-win-x64.zip
